name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required by `mcp-publisher login github-oidc`

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Sync the tag version into package.json, server.json and the patch locale
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "publishing version $VERSION"

      - name: Publish package to npm (skipped if the version already exists)
        run: |
          VER="${VERSION#v}"
          if npm view "dsh-vision-ark@$VER" version >/dev/null 2>&1; then
            echo "dsh-vision-ark@$VER is already on npm; skipping publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata to the MCP Registry
        run: ./mcp-publisher publish

      # Alternative to OIDC: create a PAT with read:org only, store it as
      # MCP_GITHUB_TOKEN, then replace the login step above with:
      #   ./mcp-publisher login github --token ${{ secrets.MCP_GITHUB_TOKEN }}
